# Continuous integration (plan §3, §9). The jobs call the root Makefile, so CI runs exactly
# what `make install`, `make lint` and `make test` run locally.
#
# Path scoping is done with job-level `if:` on the `changes` job's outputs, never with a
# workflow-level `paths:` filter: main's required status checks would wait forever for a check
# that such a filter never started. `ci-ok` is the one check to require; a skipped job passes it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR's newer push cancels its older run; each push to main keeps its own run.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    outputs:
      # A push to main runs everything.
      backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docs/schema.sql' # tests/architecture/test_migration_sql.py reads it
              - 'scripts/**'
              - 'Makefile'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/**'

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: x
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:x@localhost:5432/postgres
      REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv reads the Python version from backend/.python-version.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: make install-backend
        run: make install-backend
      - name: make lint-backend (uv lock --check, ruff, ruff format, mypy)
        run: make lint-backend
      - name: make test-backend (Alembic head, migration smoke, pytest + coverage)
        run: make test-backend

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the frontend scaffold
        id: scaffold
        run: |
          set -euo pipefail
          if [[ -f frontend/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=frontend::frontend/package.json not found: no frontend scaffold yet, nothing to run"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scaffold.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: make install-frontend
        if: steps.scaffold.outputs.present == 'true'
        run: make install-frontend
      - name: make lint-frontend (lint, typecheck)
        if: steps.scaffold.outputs.present == 'true'
        run: make lint-frontend
      - name: make test-frontend
        if: steps.scaffold.outputs.present == 'true'
        run: make test-frontend

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: make lint-commits (the PR's commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: make lint-commits

  ci-ok:
    name: ci-ok
    needs: [changes, backend, frontend, commits]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          bad=$(jq '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length' <<<"$NEEDS")
          if [[ "$bad" -ne 0 ]]; then
            echo "::error title=ci-ok::$bad needed job(s) failed or were cancelled"
            exit 1
          fi

  # AI review (alibaba/open-code-review) with Gemini's OpenAI-compatible endpoint (free tier;
  # Google may use the prompts, here the diff of a public repository, to improve its products).
  # It starts only once ci-ok has passed and is deliberately not part of ci-ok: an LLM outage or
  # a missing key must not block a merge. Secrets are unavailable on fork PRs, so it runs only
  # for branches of this repository; pull_request_target is never used.
  ai-review:
    name: ai-review
    needs: ci-ok
    # always() drops the implicit success(), which would also require every upstream job (a
    # skipped frontend or backend job included) to succeed; ci-ok already decides that.
    if: >-
      always() && needs.ci-ok.result == 'success'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # inline comments and the summary comment
    steps:
      # The action checks the PR out again itself; this copy provides the schema and the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the review key
        env:
          OCR_TOKEN: ${{ secrets.OPEN_CODE_REVIEW_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$OCR_TOKEN" ]]; then
            echo "::error title=ai-review::secret OPEN_CODE_REVIEW_API_KEY is not set (a Google AI Studio key; see README)"
            exit 1
          fi
      - uses: alibaba/open-code-review@a758d9cbfb689937c7857ad64b2dd66adb58c0c2 # v1.12.11
        with:
          llm_url: https://generativelanguage.googleapis.com/v1beta/openai/ # OCR appends chat/completions
          llm_auth_token: ${{ secrets.OPEN_CODE_REVIEW_API_KEY }}
          llm_model: gemini-3.8-flash
          llm_protocol: openai
          llm_use_anthropic: "false"
          # The default '{"thinking": {"type": "disabled"}}' is an Anthropic-style field.
          llm_extra_body: "{}"
          ocr_version: "1.12.11" # the npm CLI, pinned with the action instead of "latest"
          # Path-specific project rules (instead of OCR's default .opencodereview/rule.json).
          rule: .github/ai-review/rule.json
          # The reviewer's role.
          background: >-
            You are a principal software engineer and architect, expert in Python 3.12, FastAPI,
            async SQLAlchemy 2, PostgreSQL 16, Alembic, RabbitMQ (aio-pika), React with
            TypeScript, Mantine and TanStack Query, testing, and GitHub Actions. You are reviewing
            a pull request of a modular-monolith web application; its conventions are in
            CLAUDE.md, backend/CLAUDE.md and frontend/CLAUDE.md. Your job: find incorrect code
            and logic, bugs, bad practices, security issues and architecture violations. Report
            only concrete issues, each with the scenario that breaks and the fix; no praise, no
            style nits that ruff, mypy or eslint already catch. Write in English. Begin every
            comment with [SEVERITY confidence=C], where SEVERITY is INFO, LOW, MEDIUM or HIGH and
            C is your confidence from 0 to 1, for example: [HIGH confidence=0.9].
          # Large PRs: OCR reviews files in groups capped at 200k prompt tokens and splits any
          # group over the cap; a single file diff over ~160k tokens is skipped (reported below).
          checkpoint_range: "true" # after the first full review, review only the new commits
          review_concurrency: "2" # stay within the Gemini free-tier rate limits
          max_tokens_budget: "3000000" # hard cap per run; past it, partial results are posted
      # The action posts each finding as one inline review comment on its lines. This step also
      # turns the result into review.json ({summary, findings[]}) and validates it against the
      # schema; a finding without a severity or confidence fails it.
      - name: Build review.json and validate it against .github/ai-review/review.schema.json
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/ocr-result.json ]]; then
            echo "no review result to validate (see the report step)"
            exit 0
          fi
          python3 -I scripts/ai_review.py /tmp/ocr-result.json \
            .github/ai-review/review.schema.json "$RUNNER_TEMP/ai-review/review.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ai-review
          path: ${{ runner.temp }}/ai-review/review.json
          if-no-files-found: ignore # absent only when the review produced no result (reported below)
      - name: Report what the review did not cover
        if: always()
        run: |
          set -euo pipefail
          result=/tmp/ocr-result.json
          if [[ ! -s "$result" ]]; then
            echo "::warning title=ai-review::no review result was produced"
            exit 0
          fi
          status=$(jq -r '.status // "unknown"' "$result")
          {
            echo "### AI review: $status"
            jq -r '.summary // {} | to_entries[] | "- \(.key): \(.value)"' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.warnings[]? | if type == "string" then . else tojson end' "$result" \
            | while IFS= read -r w; do
                echo "::warning title=ai-review not covered::$w"
                echo "- not covered: $w" >> "$GITHUB_STEP_SUMMARY"
              done
