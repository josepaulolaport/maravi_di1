[project]
name = "di1"
version = "0.1.0"
description = "Maravi DI1 Backoffice: DI1 pricing and single-portfolio processing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=10.1.0,<11",
    "alembic>=1.20.0,<1.21",
    "fastapi>=0.142.2,<0.143",
    "psycopg[binary]>=3.3.6,<3.4",
    "pydantic>=2.13.5,<2.14",
    "pydantic-settings>=2.15.0,<2.16",
    "sqlalchemy[asyncio]>=2.1.3,<2.2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/di1"]

[tool.uv]
# Reproducible resolution: nothing published in the two weeks before 2026-10-18.
exclude-newer = "2026-10-04T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "DTZ", "T20", "ASYNC"]
# The spec's formulas use the true minus and multiplication signs in comments and docstrings.
allowed-confusables = ["−", "×"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
# pytest-asyncio runs every async test; do not use the anyio marker (anyio is installed by httpx2).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/di1"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<2.14",
    "hypothesis>=6.168.3,<7",
    "mypy>=2.4.0,<2.5",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.10,<0.17",
]
