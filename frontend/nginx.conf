# Serves the built SPA and forwards the API to the `api` Compose service (frontend/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # Hashed file names: cache for a year; index.html below is never cached.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (React Router) fall back to the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
