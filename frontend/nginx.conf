# Serves the built SPA and forwards the API to the `api` Compose service (frontend/Dockerfile).
# The unprivileged nginx image runs as a non-root user, so it listens on 8080, not 80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Text assets compressed on the fly (the JS chunks and the CSS are most of a first load).
    # nginx already compresses text/html; the API's JSON is compressed too.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json
        image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # Hashed file names: cache for a year; index.html below is never cached.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (React Router) fall back to the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
