# Local stack (plan §0): PostgreSQL 16, RabbitMQ 4.1, the one-shot migration, catalogue seed and
# demo data, the API, the outbox relay, the one processing worker and the web UI.
# `docker compose up --build`; the UI answers on http://localhost:8080, the API on http://127.0.0.1:8000 (/health, /api/...), the RabbitMQ
# management UI on http://127.0.0.1:15672.
#
# The credentials are local development defaults; override them with the DI1_* variables. Each
# user and password sets the server's account and is also copied, as is, into DATABASE_URL or
# RABBITMQ_URL, so use only URL-safe characters in them (letters, digits, - . _ ~): an @ : / % or
# # would break the URL, and percent-encoding it would set the server's password to the encoded
# text. Image tags name a version, not a digest (local stack; CI uses the same tags).
# Settings come from di1.platform.config: DATABASE_URL (postgresql+psycopg://) for every backend
# process, RABBITMQ_URL only for the processes that use the broker (the API never publishes).
# The RABBITMQ_* tuning values must be the same in every broker process: a queue re-declared with
# another delivery limit fails with PRECONDITION_FAILED.

name: di1

x-database-env: &database-env
  DATABASE_URL: postgresql+psycopg://${DI1_DB_USER:-di1}:${DI1_DB_PASSWORD:-di1}@postgres:5432/${DI1_DB_NAME:-di1}
  LOG_LEVEL: ${DI1_LOG_LEVEL:-INFO}

x-broker-env: &broker-env
  RABBITMQ_URL: amqp://${DI1_RABBITMQ_USER:-di1}:${DI1_RABBITMQ_PASSWORD:-di1}@rabbitmq:5672/

x-backend: &backend
  build: ./backend
  image: di1-backend:local

# The worker processes' health check (di1.workers.healthcheck): healthy while the heartbeat file
# the process touches (HEARTBEAT_FILE) is younger than HEARTBEAT_MAX_AGE_SECONDS. It opens no
# connection. Docker does not restart an unhealthy container; a process that cannot go on exits
# instead (status 1) and its restart policy brings it back.
x-heartbeat-check: &heartbeat-check
  test: ["CMD", "python", "-m", "di1.workers.healthcheck"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 30s
  start_interval: 1s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DI1_DB_USER:-di1}
      POSTGRES_PASSWORD: ${DI1_DB_PASSWORD:-di1}
      POSTGRES_DB: ${DI1_DB_NAME:-di1}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during initdb the temporary server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${DI1_RABBITMQ_USER:-di1}
      RABBITMQ_DEFAULT_PASS: ${DI1_RABBITMQ_PASSWORD:-di1}
    ports:
      - "127.0.0.1:${DI1_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # As the rabbitmq user: run as root before the node starts, the CLI writes an Erlang cookie
      # the node cannot read, and the node exits.
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Seeds the catalogue the UI cannot create (scripts/seed_catalogue.sql: FUTURE, its
  # INTEREST_RATE_FUTURE class and the DI1 product), idempotently, on every `up` after the
  # migrations, so a fresh stack can create contracts and trade at once. psql from the postgres
  # image; the backend image has no client.
  seed:
    image: postgres:16
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -q
      - -h
      - postgres
      - -U
      - ${DI1_DB_USER:-di1}
      - -d
      - ${DI1_DB_NAME:-di1}
      - -f
      - /seed/seed_catalogue.sql
    environment:
      PGPASSWORD: ${DI1_DB_PASSWORD:-di1}
    volumes:
      - ./scripts/seed_catalogue.sql:/seed/seed_catalogue.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "di1.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *database-env
    ports:
      - "127.0.0.1:${DI1_API_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Demo data (scripts/seed_demo.py): two weeks of DI1 contracts, ledger entries and reference
  # prices, dated relative to the first `up`, written through the API once it is healthy. Once
  # its last price is there it adds nothing, so later `up`s are no-ops; a run that stopped
  # part-way is reported and asks for `down -v`. It always exits 0, printing "DEMO DATA NOT
  # LOADED: <reason>" on a failure. It queues no processing. DI1_DEMO=0 turns it off (make e2e does, to keep its ledger empty).
  demo:
    <<: *backend
    command: ["python", "/demo/seed_demo.py", "--api", "http://api:8000"]
    environment:
      DI1_DEMO: ${DI1_DEMO:-1}
    volumes:
      - ./scripts/seed_demo.py:/demo/seed_demo.py:ro
    depends_on:
      seed:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: "no"

  # Publishes the outbox to RabbitMQ and, once an hour, deletes the outbox rows published more
  # than OUTBOX_RETENTION_DAYS ago (default 7). Its heartbeat is touched after each poll (every
  # second when idle), so a fresh file means the loop is progressing.
  outbox-relay:
    <<: *backend
    command: ["python", "-m", "di1.workers.outbox_relay"]
    environment:
      <<: [*database-env, *broker-env]
      HEARTBEAT_FILE: /tmp/di1-outbox-relay.heartbeat
    healthcheck: *heartbeat-check
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Exactly one processing worker (OQ-45), and no dispatcher (OQ-46): at startup it recovers an
  # interrupted run and sweeps the queued requests; then, on each run message, it takes the oldest
  # queued request, and sweeps after every run and every WORKER_SWEEP_INTERVAL_SECONDS (5 s). It
  # must never be scaled. It stops on SIGTERM within the default grace period. It exits 1 on
  # a startup failure, and when a run cannot record its end (the run would stay RUNNING and hold
  # the queue): the restart's recovery then finishes the run. Its heartbeat is touched every 5 s
  # by a task of its event loop, the startup recovery included, so a fresh file means the
  # process is responsive.
  worker:
    <<: *backend
    command: ["python", "-m", "di1.workers.main"]
    environment:
      <<: [*database-env, *broker-env]
      HEARTBEAT_FILE: /tmp/di1-worker.heartbeat
    healthcheck: *heartbeat-check
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # The built React app on nginx, which forwards /api/ and /health to the api service
  # (frontend/Dockerfile, frontend/nginx.conf): the UI on the real API, no MSW mocks.
  web:
    build: ./frontend
    image: di1-web:local
    ports:
      - "127.0.0.1:${DI1_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      # Also waits for the one-shot demo step, so `up --wait` treats its exit 0 as done. The demo
      # always exits 0 (a failure prints "DEMO DATA NOT LOADED"), so it never blocks the UI.
      demo:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
